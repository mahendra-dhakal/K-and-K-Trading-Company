{% extends "base.html" %}
{% block title %}Something Went Wrong{% endblock %}
{% block content %}
<div class="error-page">
  <div>
    <div class="error-code">500</div>
    <h1>Something went wrong on our end.</h1>
    <p style="color:var(--color-muted);margin:14px 0 32px;">We're working on it. Please try again in a moment.</p>
    <a href="{% url 'core:home' %}" class="btn btn-primary">Return Home <i class="bi bi-arrow-right"></i></a>
  </div>
</div>
{% endblock %}
